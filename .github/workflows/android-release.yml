name: Android Release AAB Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build artifact type (aab or apk)'
        required: true
        default: 'aab'
        type: choice
        options:
          - aab
          - apk
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: |
          npm ci
          cd app && npm ci

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Decode Release Keystore (if provided)
        if: "${{ env.KEYSTORE_BASE64 != '' }}"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (AAB)
        if: "${{ inputs.build_type == 'aab' || startsWith(github.ref, 'refs/tags/v') }}"
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Android APK (if requested)
        if: "${{ inputs.build_type == 'apk' }}"
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release AAB
        if: "${{ inputs.build_type == 'aab' || startsWith(github.ref, 'refs/tags/v') }}"
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload Release APK
        if: "${{ inputs.build_type == 'apk' }}"
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
